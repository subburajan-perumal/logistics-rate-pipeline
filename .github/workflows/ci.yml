# CI (docs/PLAN.md D-36): no cloud credentials anywhere in this file.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.27"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}"}
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with: {version: latest}
      - run: go test -race -count=1 ./...
      - name: parse benchmark (sanity, not committed)
        run: go test ./internal/parse/ -run xxx -bench BenchmarkParseCSV -benchmem -benchtime 3x

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r spark/requirements.lock -e "spark[dev]"
      - run: ruff check spark/src spark/tests && ruff format --check spark/src spark/tests
      - run: python -m pytest spark/tests -q
        env: {PYSPARK_PYTHON: python, PYSPARK_DRIVER_PYTHON: python}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v4.3.0}
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint deploy/helm/rate-pipeline -f deploy/helm/rate-pipeline/values-kind.yaml
      - run: helm template rates deploy/helm/rate-pipeline -n rates -f deploy/helm/rate-pipeline/values-kind.yaml | kubeconform -strict -summary -kubernetes-version 1.36.1
      - run: helm template rates deploy/helm/rate-pipeline -n rates -f deploy/helm/rate-pipeline/values-eks.yaml --set ingestd.s3.bucket=b | kubeconform -strict -summary -kubernetes-version 1.36.1

  docker:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ingestd
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ingestd
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/ingestd:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ingestd:latest
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build mocksources
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mocksources
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/mocksources:${{ github.sha }}
            ghcr.io/${{ github.repository }}/mocksources:latest
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E "ingestd|mocksources" || true

  kind-e2e:
    runs-on: ubuntu-latest
    needs: [go, helm]
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target ingestd -t ghcr.io/${{ github.repository }}/ingestd:dev . && docker build --target mocksources -t ghcr.io/${{ github.repository }}/mocksources:dev .
      - uses: helm/kind-action@v1
        with:
          cluster_name: rates
          config: deploy/kind/cluster.yaml
      - run: kind load docker-image ghcr.io/${{ github.repository }}/ingestd:dev ghcr.io/${{ github.repository }}/mocksources:dev --name rates
      - run: |
          kubectl create namespace rates
          kubectl -n rates create secret generic ingestd-secrets --from-literal=EVENTIDE_API_KEY=eventide-demo-key
          helm upgrade --install rates deploy/helm/rate-pipeline -n rates -f deploy/helm/rate-pipeline/values-kind.yaml \
            --set ingestd.ingress.enabled=false --set mocksources.latencyScale=0.2 --wait --timeout 180s
      - run: helm test rates -n rates --logs
      - run: bash tests/e2e/shutdown.sh rates
      - if: failure()
        run: kubectl -n rates get all && kubectl -n rates describe pods && kubectl -n rates logs -l app.kubernetes.io/component=ingestd --tail=200
